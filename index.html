<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JakeDRavioli &bull; Under Construction</title>

    <meta name="theme-color" content="#13111C">
    <link rel="icon" type="image/png" href="/normalicon/favicon-96x96.png" sizes="96x96" />
    <link rel="apple-touch-icon" href="/normalicon/apple-touch-icon.png" />
    <link rel="manifest" href="/normalicon/site.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/0bca0ecf78.js" crossorigin="anonymous"></script>

    <style>
        :root {
            --bg-color: #0b0914;
            --card-bg: rgba(22, 18, 38, 0.75);
            --card-border: rgba(168, 85, 247, 0.25);
            --accent-primary: #a855f7;
            --accent-glow: rgba(168, 85, 247, 0.35);
            --text-main: #f3f0ff;
            --text-muted: #a39eb8;
            --badge-bg: rgba(168, 85, 247, 0.12);
            --badge-border: rgba(168, 85, 247, 0.35);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(147, 51, 234, 0.18) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(79, 70, 229, 0.15) 0%, transparent 45%),
                radial-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 24px 24px;
            color: var(--text-main);
            font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 580px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 48px 36px;
            text-align: center;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            box-shadow: 
                0 20px 50px rgba(0, 0, 0, 0.5),
                0 0 40px var(--accent-glow);
            position: relative;
            z-index: 2;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(18px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .avatar-wrap {
            width: 88px;
            height: 88px;
            margin: 0 auto 24px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.3), rgba(79, 70, 229, 0.3));
            padding: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 24px var(--accent-glow);
        }

        .avatar-wrap img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background: #141126;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.82rem;
            color: #d8b4fe;
            background: var(--badge-bg);
            border: 1px solid var(--badge-border);
            border-radius: 999px;
            margin-bottom: 20px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #a855f7;
            box-shadow: 0 0 10px #a855f7;
            animation: pulse 1.8s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.85); }
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff 40%, #c084fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .lead {
            font-size: 1.05rem;
            line-height: 1.6;
            color: var(--text-muted);
            margin-bottom: 32px;
        }

        .info-box {
            background: rgba(10, 8, 20, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: #d1cbe5;
            font-size: 0.95rem;
        }

        .info-box i {
            color: var(--accent-primary);
            font-size: 1.1rem;
        }

        .social-links {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .social-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            transition: all 0.25s ease;
        }

        .social-btn:hover {
            background: rgba(168, 85, 247, 0.2);
            border-color: var(--accent-primary);
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 4px 14px rgba(168, 85, 247, 0.25);
        }

        .footer {
            margin-top: 36px;
            font-size: 0.8rem;
            color: #6d6787;
            font-family: 'JetBrains Mono', monospace;
        }

        @media (max-width: 480px) {
            .container {
                padding: 36px 22px;
            }
            h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="avatar-wrap">
            <img src="/normalicon/favicon-96x96.png" alt="JakeDRavioli Logo">
        </div>

        <div class="badge">
            <span class="pulse-dot"></span>
            Under Construction
        </div>

        <h1>We're Upgrading</h1>
        <p class="lead">
            The site is currently offline while undergoing a complete overhaul and migration to a brand new platform. We'll be back shortly!
        </p>

        <div class="info-box">
            <i class="fa-solid fa-code-merge"></i>
            <span>Big improvements and shiny new features in progress.</span>
        </div>

        <div class="social-links">
            <a href="https://github.com/JakeDRavioli" target="_blank" rel="noopener noreferrer" class="social-btn">
                <i class="fa-brands fa-github"></i> GitHub
            </a>
            <a href="https://bsky.app/profile/jakedravioli.bsky.social" target="_blank" rel="noopener noreferrer" class="social-btn">
                <i class="fa-solid fa-cloud"></i> Bluesky
            </a>
            <a href="https://vecshift.co.uk" class="social-btn">
                <i class="fa-solid fa-gamepad"></i> vecShift Studios
            </a>
        </div>

        <div class="footer">
            &copy; <span id="year">2026</span> JakeDRavioli &bull; All rights reserved.
        </div>
    </div>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>
</body>
</html>
